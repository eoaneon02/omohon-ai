<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>メニュー翻訳AIツール</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f7f9fa; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #3498db; padding-bottom: 8px; margin-top: 0; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        #result-area { margin-top: 20px; padding: 15px; background-color: #e8f6f3; border-left: 4px solid #1abc9c; display: none; }
        .result-title { font-weight: bold; color: #16a085; font-size: 1.1em; margin-top: 0; }
        .error-text { color: #e74c3c; background: #fadbd8; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>メニュー英語変換ツール</h2>
        <div class="form-group">
            <label>料理名（必須）</label>
            <input type="text" id="foodName" placeholder="例：治部煮、豚汁、焼きピエロギ">
        </div>
        <div class="form-group">
            <label>メイン食材・調理法（任意）</label>
            <input type="text" id="ingredients" placeholder="例：旬の海鮮丼 / 豚肉と野菜の味噌汁">
        </div>
        <button onclick="generateTranslation()" id="submitBtn">英語メニューを生成する</button>

        <div id="result-area">
            <p class="result-title">■ 生成結果</p>
            <div id="result-content"></div>
        </div>
    </div>

    <script>
        async function generateTranslation() {
            const foodName = document.getElementById('foodName').value.trim();
            const ingredients = document.getElementById('ingredients').value.trim();
            const resultArea = document.getElementById('result-area');
            const resultContent = document.getElementById('result-content');
            const submitBtn = document.getElementById('submitBtn');

            if (!foodName) {
                alert("料理名を入力してください。");
                return;
            }

            resultArea.style.display = 'block';
            resultContent.innerHTML = '<p style="color:#666;">AIが翻訳を生成しています... ⏳</p>';
            submitBtn.disabled = true;
            submitBtn.textContent = '生成中...';

            try {
                const response = await fetch('/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ foodName, ingredients })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "通信に失敗しました。");
                }

                resultContent.innerHTML = `
                    <p><strong>【メニュー表記】</strong><br>
                    <span style="font-size: 1.1em; color: #2c3e50;">${data.englishName}</span><br>
                    <span style="font-size:0.9em; color:#555;">${data.description}</span></p>
                    
                    <p><strong>【接客ワンフレーズ】</strong><br>
                    <span style="font-style: italic; color: #2c3e50;">"${data.phrase}"</span><br>
                    <span style="font-size: 0.9em; color: #555;">（${data.phraseJapanese}）</span></p>
                `;
            } catch (error) {
                resultContent.innerHTML = `<div class="error-text"><strong>エラーが発生しました:</strong><br>${error.message}</div>`;
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '英語メニューを生成する';
            }
        }
    </script>
</body>
</html>
